name: .NET CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore src/HelloDotnet.csproj
          dotnet restore tests/HelloDotnet.Tests.csproj

      - name: Build
        run: |
          dotnet build tests/HelloDotnet.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Run tests
        run: |
          dotnet test tests/HelloDotnet.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal

  release:
    name: Build ${{ matrix.name }}
    needs: test

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux x64
            rid: linux-x64
            artifact: hello-dotnet-linux-x64

          - name: Linux ARM64
            rid: linux-arm64
            artifact: hello-dotnet-linux-arm64

          - name: Windows x64
            rid: win-x64
            artifact: hello-dotnet-windows-x64.exe

          - name: macOS x64
            rid: osx-x64
            artifact: hello-dotnet-macos-x64

          - name: macOS ARM64
            rid: osx-arm64
            artifact: hello-dotnet-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/HelloDotnet.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output dist/${{ matrix.rid }}

      - name: Rename binary
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv dist/${{ matrix.rid }}/hello-dotnet.exe \
              dist/${{ matrix.artifact }}
          else
            mv dist/${{ matrix.rid }}/hello-dotnet \
              dist/${{ matrix.artifact }}
          fi

      - name: Check binary
        run: |
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: release

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: hello-dotnet-linux-x64
          path: release

      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: hello-dotnet-linux-arm64
          path: release

      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: hello-dotnet-windows-x64.exe
          path: release

      - name: Download macOS x64
        uses: actions/download-artifact@v4
        with:
          name: hello-dotnet-macos-x64
          path: release

      - name: Download macOS ARM64
        uses: actions/download-artifact@v4
        with:
          name: hello-dotnet-macos-arm64
          path: release

      - name: Show release files
        run: |
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/hello-dotnet-linux-x64
            release/hello-dotnet-linux-arm64
            release/hello-dotnet-windows-x64.exe
            release/hello-dotnet-macos-x64
            release/hello-dotnet-macos-arm64